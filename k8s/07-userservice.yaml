apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: ecommerce
  labels: { app: userservice }
spec:
  replicas: 2
  selector:
    matchLabels: { app: userservice }
  template:
    metadata:
      labels: { app: userservice }
    spec:
      containers:
        - name: userservice
          image: ecommerce/userservice:latest   # built from ./userservice/Dockerfile
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: otel-config }
          env:
            - name: USER_DB_HOST
              value: postgres-user
            - name: USER_DB_PORT
              value: "5432"
            - name: USER_DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: USER_DB_USER } }
            - name: USER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: USER_DB_PASSWORD } }
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: ecommerce
spec:
  selector: { app: userservice }
  ports:
    - port: 8081
      targetPort: 8081
