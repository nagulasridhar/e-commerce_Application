# Placeholder credentials for local/demo use only. In a real cluster, generate
# this with `kubectl create secret generic db-credentials --from-literal=...`
# (or a sealed-secret / external-secrets setup) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ecommerce
type: Opaque
stringData:
  CATALOG_DB_USER: productServiceUser
  CATALOG_DB_PASSWORD: StrongPassword123
  USER_DB_USER: userServiceUser
  USER_DB_PASSWORD: StrongPassword123
  ORDER_DB_USER: orderServiceUser
  ORDER_DB_PASSWORD: StrongPassword123
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
