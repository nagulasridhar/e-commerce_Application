apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: ecommerce
  labels: { app: orderservice }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orderservice }
  template:
    metadata:
      labels: { app: orderservice }
    spec:
      containers:
        - name: orderservice
          image: ecommerce/orderservice:latest   # built from ./orderservice/Dockerfile
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: otel-config }
          env:
            - name: ORDER_DB_HOST
              value: postgres-order
            - name: ORDER_DB_PORT
              value: "5432"
            - name: ORDER_DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: ORDER_DB_USER } }
            - name: ORDER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: ORDER_DB_PASSWORD } }
            - name: USERSERVICE_URL
              value: http://userservice.ecommerce.svc.cluster.local:8081
            - name: CATALOGSERVICE_URL
              value: http://catalogservice.ecommerce.svc.cluster.local:8080
            - name: PAYMENTSERVICE_URL
              value: http://paymentservice.ecommerce.svc.cluster.local:8083
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: ecommerce
spec:
  selector: { app: orderservice }
  ports:
    - port: 8082
      targetPort: 8082
